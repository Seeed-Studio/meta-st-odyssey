# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-st-odyssey"
BBFILE_PATTERN_meta-st-odyssey = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-st-odyssey = "7"

LAYERDEPENDS_meta-st-odyssey = "core"
LAYERSERIES_COMPAT_meta-st-odyssey = "scarthgap"

# Build only the Odyssey devicetree (ST's machine conf appends its whole board matrix)
STM32MP_DT_FILES_SDCARD:forcevariable = "stm32mp157c-odyssey"
STM32MP_DT_FILES_EMMC:forcevariable = "stm32mp157c-odyssey"
STM32MP_DT_FILES_NAND:forcevariable = ""
STM32MP_DT_FILES_NOR_mb:forcevariable = ""
UBOOT_EXTLINUX_TARGETS_EXTRA_CONFIG[stm32mp157c-odyssey] += "stm32mp157c-odyssey"

BOOTDEVICE_LABELS = "emmc sdcard"

# Shrink the sdcard flash layout: 1.75 GiB rootfs slot, 64 MiB userfs (stock 3 GiB / 128 MiB)
STM32MP_ROOTFS_SIZE = "1835008"
STM32MP_USERFS_SIZE = "65536"

# Boot mode baked into the image's u-boot-env partition: sdcard (stock U-Boot env),
# emmc (U-Boot boots the system installed on the eMMC) or net (TFTP kernel + NFS root,
# see u-boot-env-odyssey.bb for the server/IP settings)
ODYSSEY_BOOT_MODE ?= "sdcard"
STM32MP_UENV_DATA = "${@'u-boot-env/u-boot-env-%s.bin' % d.getVar('ODYSSEY_BOOT_MODE') if d.getVar('ODYSSEY_BOOT_MODE') in ('net', 'emmc') else ''}"
EXTRA_IMAGEDEPENDS += "u-boot-env-odyssey"
